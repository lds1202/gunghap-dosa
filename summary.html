<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>궁합 결과 - 궁합도사</title>

    <link rel="canonical" href="https://1icarus.com/gunghap-dosa/summary.html">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HCWXTWEK1J"></script>

        window.dataLayer = window.dataLayer || [];

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};

            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "tmue9ya7ho");

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2635949625184038" crossorigin="anonymous"></script>
    <script>
        // AdSense 스크립트 로드 완료 확인
        window.addEventListener('load', function() {
            if (typeof adsbygoogle === 'undefined') {
                console.log('Summary - AdSense 스크립트 로드 대기 중...');
            } else {
                console.log('Summary - AdSense 스크립트 로드 완료');
            }
        });
    </script>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">🔮 궁합도사</h1>
        </header>

        <main class="main-content">
            <div id="resultContainer" class="result-container fade-in">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 궁합도사. All rights reserved.</p>
        </footer>
    </div>

    <script src="saju-analyzer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Summary 페이지 로드 완료');
            
            // localStorage에서 결과 가져오기
            const resultString = localStorage.getItem('compatibilityResult');
            
            if (!resultString) {
                alert('궁합 결과가 없습니다. 다시 분석해주세요.');
                window.location.href = 'index.html';
                return;
            }
            
            let result;
            try {
                result = JSON.parse(resultString);
                console.log('요약 페이지에서 로드된 결과:', result);
            } catch (error) {
                console.error('결과 파싱 오류:', error);
                alert('결과 데이터가 손상되었습니다. 다시 분석해주세요.');
                window.location.href = 'index.html';
                return;
            }
            
            if (!result || !result.score || !result.maleName || !result.femaleName) {
                console.error('결과 데이터가 불완전합니다:', result);
                alert('결과 데이터가 불완전합니다. 다시 분석해주세요.');
                window.location.href = 'index.html';
                return;
            }
            
            // 컨테이너 요소 가져오기
            const container = document.getElementById('resultContainer');
            if (!container) {
                console.error('resultContainer를 찾을 수 없습니다.');
                return;
            }
            
            // 등급 결정
            let gradeClass = 'normal';
            let gradeText = '보통 😊';
            if (result.score >= 85) {
                gradeClass = 'excellent';
                gradeText = '천생연분 💖';
            } else if (result.score >= 70) {
                gradeClass = 'good';
                gradeText = '매우 좋음 🌟';
            } else if (result.score < 55) {
                gradeClass = 'fair';
                gradeText = '노력 필요 🤔';
            }
            
            // SVG 원형 진행바 계산
            const circumference = 565;
            const offset = circumference - (circumference * result.score / 100);
            
            // HTML 생성
            const htmlContent = 
                '<div class="result-header">' +
                    '<h2>궁합 분석 결과</h2>' +
                    '<div class="couple-names">' +
                        '<span class="name male-name">' + result.maleName + '</span>' +
                        '<span class="heart">💕</span>' +
                        '<span class="name female-name">' + result.femaleName + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="score-container">' +
                    '<div class="score-circle">' +
                        '<svg class="score-svg" viewBox="0 0 200 200">' +
                            '<circle class="score-bg" cx="100" cy="100" r="90"></circle>' +
                            '<circle class="score-fill" cx="100" cy="100" r="90" style="stroke-dasharray: 565; stroke-dashoffset: ' + offset + ';"></circle>' +
                        '</svg>' +
                        '<div class="score-text">' +
                            '<span class="score-number">' + result.score + '</span>' +
                            '<span class="score-unit">점</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="score-grade">' +
                        '<span class="grade ' + gradeClass + '">' + gradeText + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="saju-info">' +
                    '<h3>📅 사주팔자 정보</h3>' +
                    '<div class="saju-row">' +
                        '<div class="saju-person">' +
                            '<strong>' + result.maleName + '</strong>' +
                            '<div class="saju-pillars-summary">' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">연주</span><span class="pillar-summary-value">' + result.maleSaju.year + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">월주</span><span class="pillar-summary-value">' + result.maleSaju.month + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">일주</span><span class="pillar-summary-value highlight">' + result.maleSaju.day + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">시주</span><span class="pillar-summary-value">' + result.maleSaju.time + '</span></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="saju-person">' +
                            '<strong>' + result.femaleName + '</strong>' +
                            '<div class="saju-pillars-summary">' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">연주</span><span class="pillar-summary-value">' + result.femaleSaju.year + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">월주</span><span class="pillar-summary-value">' + result.femaleSaju.month + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">일주</span><span class="pillar-summary-value highlight">' + result.femaleSaju.day + '</span></div>' +
                                '<div class="pillar-summary-item"><span class="pillar-summary-label">시주</span><span class="pillar-summary-value">' + result.femaleSaju.time + '</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="ad-container ad-summary">' +
                    '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2635949625184038" data-ad-slot="4133822401" data-ad-format="auto" data-full-width-responsive="true"></ins>' +
                '</div>' +
                '<div class="detail-sections">' +
                    '<div class="detail-section">' +
                        '<div class="section-icon">💕</div>' +
                        '<h3 class="section-title">애정운</h3>' +
                        '<p class="section-content">' + result.details.love + '</p>' +
                    '</div>' +
                    '<div class="ad-container ad-summary-middle1">' +
                        '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2635949625184038" data-ad-slot="8775048649" data-ad-format="auto" data-full-width-responsive="true"></ins>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-icon">💰</div>' +
                        '<h3 class="section-title">재물운</h3>' +
                        '<p class="section-content">' + result.details.wealth + '</p>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-icon">🏥</div>' +
                        '<h3 class="section-title">건강운</h3>' +
                        '<p class="section-content">' + result.details.health + '</p>' +
                    '</div>' +
                    '<div class="detail-section">' +
                        '<div class="section-icon">👶</div>' +
                        '<h3 class="section-title">자녀운</h3>' +
                        '<p class="section-content">' + result.details.children + '</p>' +
                    '</div>' +
                    '<div class="detail-section highlight">' +
                        '<div class="section-icon">⭐</div>' +
                        '<h3 class="section-title">궁합 총평</h3>' +
                        '<p class="section-content">' + result.details.overall + '</p>' +
                    '</div>' +
                    '<div class="ad-container ad-summary-middle4">' +
                        '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2635949625184038" data-ad-slot="3870932676" data-ad-format="auto" data-full-width-responsive="true"></ins>' +
                    '</div>' +
                    '<div class="detail-section complement-section">' +
                        '<div class="section-icon">🔄</div>' +
                        '<h3 class="section-title">서로의 단점 보완법</h3>' +
                        '<div class="complement-content">' +
                            '<div class="complement-box male-complement">' +
                                '<p class="section-content">' + result.complement.male + '</p>' +
                            '</div>' +
                            '<div class="complement-box female-complement">' +
                                '<p class="section-content">' + result.complement.female + '</p>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="action-buttons">' +
                    '<button class="copy-btn" onclick="copyCompatibilityResult()">📋 통변 저장하기 (복사)</button>' +
                    '<a href="detail.html" class="detail-btn" onclick="trackEvent(\'detail_view\', \'상세 풀이 보기 클릭\')">💕 애정운 · 💰 재물운 · 🏥 건강운 · 👶 자녀운 자세히 보기</a>' +
                    '<a href="index.html" class="back-btn" onclick="trackEvent(\'back_to_home\', \'처음으로 돌아가기 클릭\')">🏠 처음으로 돌아가기</a>' +
                '</div>';
            
            // HTML 삽입
            container.innerHTML = htmlContent;
            
            // AdSense 스크립트 실행 - 모든 광고 슬롯 활성화
            function initSummaryAds() {
                try {
                    const ads = document.querySelectorAll('.adsbygoogle');
                    console.log('Summary 페이지 - 발견된 광고 개수:', ads.length);
                    
                    ads.forEach(function(ad, index) {
                        try {
                            console.log('Summary 광고 초기화 중:', index + 1);
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        } catch (e) {
                            console.error('Summary 광고 초기화 실패:', index + 1, e);
                        }
                    });
                    
                    console.log('Summary AdSense 광고 초기화 완료');
                } catch (e) {
                    console.error('Summary AdSense 초기화 오류:', e);
                }
            }
            
            // HTML 삽입 후 광고 초기화
            setTimeout(initSummaryAds, 500);
            
            // 추가 초기화 (혹시 놓친 경우)
            setTimeout(initSummaryAds, 2000);
            
            // Google Analytics 이벤트: 요약 페이지 도달
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_view', {
                    page_title: 'Summary Page',
                    page_location: window.location.href,
                    compatibility_score: result.score
                });
            }
            
            // 점수 애니메이션
            setTimeout(function() {
                const scoreNumber = document.querySelector('.score-number');
                if (scoreNumber) {
                    let current = 0;
                    const target = result.score;
                    const duration = 1500;
                    const increment = target / (duration / 16);
                    
                    function animate() {
                        current += increment;
                        if (current < target) {
                            scoreNumber.textContent = Math.floor(current);
                            requestAnimationFrame(animate);
                        } else {
                            scoreNumber.textContent = target;
                        }
                    }
                    
                    scoreNumber.textContent = '0';
                    animate();
                }
            }, 300);
        });
        
        // 이벤트 추적 헬퍼 함수
        function trackEvent(eventName, eventLabel) {
            if (typeof gtag !== 'undefined') {
                gtag('event', eventName, {
                    event_category: 'button_click',
                    event_label: eventLabel
                });
            }
        }
        
        // 한자를 한글로 변환하는 매핑
        const hanjaToKorean = {
            '甲': '갑', '乙': '을', '丙': '병', '丁': '정', '戊': '무', '己': '기', '庚': '경', '辛': '신', '壬': '임', '癸': '계',
            '子': '자', '丑': '축', '寅': '인', '卯': '묘', '辰': '진', '巳': '사', '午': '오', '未': '미', '申': '신', '酉': '유', '戌': '술', '亥': '해'
        };
        
        // 한자를 한글로 변환
        function convertToKorean(hanja) {
            return hanja.split('').map(char => hanjaToKorean[char] || char).join('');
        }
        
        // 통변 전체 내용 복사 함수
        function copyCompatibilityResult() {
            // Google Analytics 이벤트: 통변 복사
            if (typeof gtag !== 'undefined') {
                gtag('event', 'copy_result', {
                    event_category: 'engagement',
                    event_label: '통변 저장하기 클릭'
                });
            }
            
            const resultString = localStorage.getItem('compatibilityResult');
            if (!resultString) {
                alert('저장할 결과가 없습니다.');
                return;
            }
            
            const result = JSON.parse(resultString);
            
            // 복사할 텍스트 생성
            let text = '═══════════════════════════════\n';
            text += '🔮 궁합도사 - 사주 궁합 분석 결과\n';
            text += '═══════════════════════════════\n\n';
            
            // 기본 정보
            text += '【 기본 정보 】\n';
            text += '궁합 점수: ' + result.score + '점\n\n';
            
            // 남성 사주팔자
            text += '👨 ' + result.maleName + '님의 사주팔자\n';
            text += '연주(年柱): ' + result.maleSaju.year + ' (' + convertToKorean(result.maleSaju.year) + ')\n';
            text += '월주(月柱): ' + result.maleSaju.month + ' (' + convertToKorean(result.maleSaju.month) + ')\n';
            text += '일주(日柱): ' + result.maleSaju.day + ' (' + convertToKorean(result.maleSaju.day) + ')\n';
            text += '시주(時柱): ' + result.maleSaju.time + ' (' + convertToKorean(result.maleSaju.time) + ')\n\n';
            
            // 여성 사주팔자
            text += '👩 ' + result.femaleName + '님의 사주팔자\n';
            text += '연주(年柱): ' + result.femaleSaju.year + ' (' + convertToKorean(result.femaleSaju.year) + ')\n';
            text += '월주(月柱): ' + result.femaleSaju.month + ' (' + convertToKorean(result.femaleSaju.month) + ')\n';
            text += '일주(日柱): ' + result.femaleSaju.day + ' (' + convertToKorean(result.femaleSaju.day) + ')\n';
            text += '시주(時柱): ' + result.femaleSaju.time + ' (' + convertToKorean(result.femaleSaju.time) + ')\n\n';
            
            text += '═══════════════════════════════\n';
            text += '【 상세 궁합 풀이 】\n';
            text += '═══════════════════════════════\n\n';
            
            // 애정운
            text += '💕 애정운\n';
            text += '─────────────────────────────\n';
            text += result.details.love + '\n\n';
            
            // 재물운
            text += '💰 재물운\n';
            text += '─────────────────────────────\n';
            text += result.details.wealth + '\n\n';
            
            // 건강운
            text += '🏥 건강운\n';
            text += '─────────────────────────────\n';
            text += result.details.health + '\n\n';
            
            // 자녀운
            text += '👶 자녀운\n';
            text += '─────────────────────────────\n';
            text += result.details.children + '\n\n';
            
            // 궁합 총평
            text += '⭐ 궁합 총평\n';
            text += '─────────────────────────────\n';
            text += result.details.overall + '\n\n';
            
            // 서로의 단점 보완법
            text += '🔄 서로의 단점 보완법\n';
            text += '─────────────────────────────\n';
            text += result.complement.male + '\n\n';
            text += result.complement.female + '\n\n';
            
            text += '═══════════════════════════════\n';
            text += '궁합도사 - 전통 사주 기반 궁합 분석 서비스\n';
            text += '출처: https://gunghap-dosa.netlify.app/\n';
            text += '═══════════════════════════════';
            
            // 클립보드에 복사
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    alert('✅ 복사가 완료되었습니다!\n\n다른 곳에 붙여넣으세요. 📋');
                }).catch(function(err) {
                    console.error('복사 실패:', err);
                    alert('복사에 실패했습니다. 다시 시도해주세요.');
                });
            } else {
                // 구형 브라우저 대응
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();
                
                try {
                    document.execCommand('copy');
                    alert('✅ 복사가 완료되었습니다!\n\n다른 곳에 붙여넣으세요. 📋');
                } catch (err) {
                    console.error('복사 실패:', err);
                    alert('복사에 실패했습니다. 다시 시도해주세요.');
                }
                
                document.body.removeChild(textArea);
            }
        }
    </script>
</body>
</html>
